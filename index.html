<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desafio Aceito 🥊</title>
  
  <style>
    /* Estilo estilo Ringue / Fight Club */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1a1a1a; /* Fundo escuro */
      font-family: 'Arial', sans-serif;
      text-align: center;
      color: #f8f9fa;
      padding: 20px;
      box-sizing: border-box;
    }

    .ringue {
      border: 4px dashed #dc3545; /* Cordas do ringue vermelhas */
      padding: 40px 30px;
      border-radius: 12px;
      background-color: #2b2b2b;
      box-shadow: 0 0 30px rgba(220, 53, 69, 0.4);
      max-width: 500px;
      width: 100%;
    }

    h1 {
      color: #dc3545; /* Vermelho boxe */
      font-size: 28px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .destaque {
      color: #ffc107; /* Amarelo ouro para destacar o kickboxing */
      font-weight: bold;
      font-size: 20px;
    }

    .btn-luta {
      display: inline-block;
      padding: 15px 30px;
      font-size: 18px;
      background-color: #dc3545;
      color: white;
      text-decoration: none;
      font-weight: bold;
      border-radius: 8px;
      text-transform: uppercase;
      box-shadow: 0 6px 10px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s, transform 0.2s;
    }

    .btn-luta:hover {
      background-color: #c82333;
      transform: scale(1.05); /* Dá um zoom no botão ao passar o mouse */
    }
  </style>
</head>
<body>

  <div class="ringue">
    <h1>Desafio Aceito! 🥊</h1>
    <p>Você só esqueceu de um pequeno detalhe: <br><span class="destaque">eu faço kickboxing. 🥷</span></p>
    <p>Já que você chamou pro ringue, a aposta tá valendo. Se você perder, o açaí pós-treino é por sua conta.</p>
    
    <a href="https://wa.me/5579988410626?text=Oi!%20Tô%20pronta%20pra%20perder%20no%20kickboxing%20e%20pagar%20o%20açaí%20🥊" class="btn-luta" target="_blank">
      Agendar Luta (e passar o número)
    </a>
  </div>

</body>
</html>
