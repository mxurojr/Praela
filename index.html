<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Um encontro? 💕</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.55), transparent 25%),
                linear-gradient(135deg, #ffd6e7, #ffc1dc, #f8b8d8);

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* -------------------------
           CORAÇÕES DO FUNDO
        ------------------------- */

        .hearts {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .heart {
            position: absolute;
            bottom: -60px;
            font-size: 25px;
            opacity: 0;
            animation: subir linear infinite;
        }

        .heart:nth-child(1) {
            left: 8%;
            animation-duration: 7s;
            animation-delay: 0s;
        }

        .heart:nth-child(2) {
            left: 20%;
            animation-duration: 9s;
            animation-delay: 2s;
            font-size: 18px;
        }

        .heart:nth-child(3) {
            left: 35%;
            animation-duration: 8s;
            animation-delay: 4s;
            font-size: 30px;
        }

        .heart:nth-child(4) {
            left: 50%;
            animation-duration: 10s;
            animation-delay: 1s;
            font-size: 20px;
        }

        .heart:nth-child(5) {
            left: 65%;
            animation-duration: 7s;
            animation-delay: 3s;
            font-size: 32px;
        }

        .heart:nth-child(6) {
            left: 78%;
            animation-duration: 9s;
            animation-delay: 5s;
            font-size: 22px;
        }

        .heart:nth-child(7) {
            left: 90%;
            animation-duration: 8s;
            animation-delay: 2s;
            font-size: 28px;
        }

        @keyframes subir {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.5;
            }

            100% {
                transform: translateY(-110vh) rotate(25deg);
                opacity: 0;
            }
        }

        /* -------------------------
           CARTÃO PRINCIPAL
        ------------------------- */

        .card {
            position: relative;
            z-index: 2;

            width: min(92%, 470px);
            min-height: 650px;

            padding: 35px 25px;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(12px);

            border-radius: 30px;

            box-shadow:
                0 20px 60px rgba(150, 50, 100, 0.18);

            text-align: center;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* -------------------------
           CÍRCULO DA IMAGEM
        ------------------------- */

        .image-circle {
            width: 260px;
            height: 260px;

            border-radius: 50%;

            background:
                radial-gradient(circle at 50% 35%, #fff7fb, #ffd8e8);

            border: 7px solid white;

            box-shadow:
                0 10px 30px rgba(150, 50, 100, 0.20);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            margin-bottom: 25px;

            position: relative;
        }

        /* brilho no círculo */

        .image-circle::before {
            content: "";
            position: absolute;

            width: 90px;
            height: 90px;

            background: rgba(255,255,255,0.6);

            border-radius: 50%;

            top: 15px;
            left: 25px;

            filter: blur(12px);
        }

        /* -------------------------
           GATINHO
        ------------------------- */

        .cat {
            position: relative;
            width: 190px;
            height: 190px;

            display: flex;
            justify-content: center;
            align-items: center;

            animation: gatinho 3s ease-in-out infinite;
        }

        @keyframes gatinho {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-7px);
            }
        }

        /* cabeça */

        .cat-head {
            position: absolute;

            width: 115px;
            height: 100px;

            background: #fffafc;

            border-radius: 48% 48% 45% 45%;

            top: 30px;
            left: 38px;

            border: 3px solid #e9b9cd;

            z-index: 3;
        }

        /* orelhas */

        .ear-left,
        .ear-right {
            position: absolute;

            width: 45px;
            height: 55px;

            background: #fffafc;

            border: 3px solid #e9b9cd;

            z-index: 2;

            top: 5px;
        }

        .ear-left {
            left: 38px;
            transform: rotate(-30deg);
            border-radius: 8px 35px 5px 30px;
        }

        .ear-right {
            right: 38px;
            transform: rotate(30deg);
            border-radius: 35px 8px 30px 5px;
        }

        .ear-left::after,
        .ear-right::after {
            content: "";

            position: absolute;

            width: 20px;
            height: 25px;

            background: #ffc4d9;

            border-radius: 50%;
        }

        .ear-left::after {
            left: 10px;
            top: 15px;
        }

        .ear-right::after {
            right: 10px;
            top: 15px;
        }

        /* olhos */

        .eye {
            position: absolute;

            width: 13px;
            height: 18px;

            background: #5c4050;

            border-radius: 50%;

            top: 68px;

            z-index: 5;
        }

        .eye::after {
            content: "";

            position: absolute;

            width: 4px;
            height: 6px;

            background: white;

            border-radius: 50%;

            top: 3px;
            left: 3px;
        }

        .eye.left {
            left: 65px;
        }

        .eye.right {
            right: 65px;
        }

        /* nariz */

        .nose {
            position: absolute;

            width: 12px;
            height: 9px;

            background: #e889aa;

            border-radius: 50%;

            top: 88px;
            left: 52px;

            z-index: 5;
        }

        /* boca */

        .mouth {
            position: absolute;

            top: 96px;
            left: 52px;

            width: 20px;
            height: 10px;

            border-bottom: 2px solid #9c657b;

            border-radius: 0 0 50% 50%;

            z-index: 5;
        }

        /* bigodes */

        .whisker {
            position: absolute;

            width: 42px;
            height: 1px;

            background: #9c657b;

            top: 91px;

            z-index: 4;
        }

        .whisker.w1 {
            left: 0;
            transform: rotate(10deg);
        }

        .whisker.w2 {
            left: 0;
            top: 101px;
            transform: rotate(-8deg);
        }

        .whisker.w3 {
            right: 0;
            transform: rotate(-10deg);
        }

        .whisker.w4 {
            right: 0;
            top: 101px;
            transform: rotate(8deg);
        }

        /* corpo */

        .cat-body {
            position: absolute;

            width: 105px;
            height: 85px;

            background: #fffafc;

            border: 3px solid #e9b9cd;

            border-radius: 55% 55% 45% 45%;

            bottom: 10px;
            left: 43px;

            z-index: 1;
        }

        /* patas */

        .paw {
            position: absolute;

            width: 32px;
            height: 42px;

            background: #fffafc;

            border: 3px solid #e9b9cd;

            border-radius: 50%;

            bottom: 5px;

            z-index: 4;
        }

        .paw.left {
            left: 42px;
        }

        .paw.right {
            right: 42px;
        }

        /* -------------------------
           FLOR
        ------------------------- */

        .flower {
            position: absolute;

            right: 8px;
            bottom: 42px;

            width: 70px;
            height: 100px;

            z-index: 6;

            transform: rotate(-12deg);
        }

        .stem {
            position: absolute;

            width: 4px;
            height: 65px;

            background: #75ad78;

            bottom: 0;
            left: 33px;

            border-radius: 10px;
        }

        .petal {
            position: absolute;

            width: 27px;
            height: 35px;

            background: #ff7fab;

            border-radius: 50%;

            top: 5px;
            left: 20px;
        }

        .petal:nth-child(2) {
            transform: rotate(72deg);
        }

        .petal:nth-child(3) {
            transform: rotate(144deg);
        }

        .petal:nth-child(4) {
            transform: rotate(216deg);
        }

        .petal:nth-child(5) {
            transform: rotate(288deg);
        }

        .flower-center {
            position: absolute;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: #ffd66b;

            top: 14px;
            left: 25px;

            z-index: 2;
        }

        /* -------------------------
           TEXTO
        ------------------------- */

        h1 {
            color: #b84d7d;

            font-size: 32px;

            margin-bottom: 12px;
        }

        .subtitle {
            color: #7c5365;

            font-size: 17px;

            line-height: 1.5;

            max-width: 350px;

            margin-bottom: 25px;
        }

        /* -------------------------
           BOTÕES
        ------------------------- */

        .buttons {
            display: flex;
            gap: 15px;

            margin-top: auto;
        }

        button {
            border: none;

            padding: 14px 30px;

            border-radius: 50px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .yes {
            background: #e85c93;

            color: white;

            box-shadow: 0 8px 20px rgba(232,92,147,0.25);
        }

        .yes:hover {
            transform: translateY(-3px) scale(1.04);
            background: #dc4b84;
        }

        .no {
            background: white;

            color: #b84d7d;

            border: 2px solid #f0b2ca;
        }

        .no:hover {
            transform: translateY(-3px);
        }

        /* -------------------------
           RESPONSIVO
        ------------------------- */

        @media (max-width: 500px) {

            .card {
                min-height: 620px;
                padding: 28px 18px;
            }

            .image-circle {
                width: 225px;
                height: 225px;
            }

            h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 15px;
            }

            .buttons {
                flex-direction: column;
                width: 100%;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- CORAÇÕES -->
    <div class="hearts">

        <div class="heart">❤️</div>
        <div class="heart">💕</div>
        <div class="heart">💗</div>
        <div class="heart">💖</div>
        <div class="heart">❤️</div>
        <div class="heart">💕</div>
        <div class="heart">💗</div>

    </div>


    <!-- CARTÃO -->

    <main class="card">

        <!-- CÍRCULO COM GATINHO -->

        <div class="image-circle">

            <div class="cat">

                <!-- ORELHAS -->
                <div class="ear-left"></div>
                <div class="ear-right"></div>

                <!-- CORPO -->
                <div class="cat-body"></div>

                <!-- CABEÇA -->
                <div class="cat-head">

                    <div class="eye left"></div>
                    <div class="eye right"></div>

                    <div class="nose"></div>
                    <div class="mouth"></div>

                </div>

                <!-- BIGODES -->
                <div class="whisker w1"></div>
                <div class="whisker w2"></div>
                <div class="whisker w3"></div>
                <div class="whisker w4"></div>

                <!-- PATAS -->
                <div class="paw left"></div>
                <div class="paw right"></div>


                <!-- FLOR -->

                <div class="flower">

                    <div class="stem"></div>

                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>
                    <div class="petal"></div>

                    <div class="flower-center"></div>

                </div>

            </div>

        </div>


        <!-- TEXTO -->

        <h1>Tenho uma pergunta... 💕</h1>

        <p class="subtitle">
            E se a gente deixasse de só conversar
            e finalmente marcasse aquele encontro? 🌹
        </p>


        <!-- BOTÕES -->

        <div class="buttons">

            <button class="yes" onclick="sim()">
                Sim 💗
            </button>

            <button class="no" onclick="nao()">
                Talvez 😳
            </button>

        </div>

    </main>


    <script>

        function sim() {

            alert("Eu sabia! 😳❤️ Agora só falta escolher o dia.");

        }

        function nao() {

            alert("Tudo bem... mas o gatinho vai continuar esperando com a flor 🥹🌹");

        }

    </script>

</body>
</html>
